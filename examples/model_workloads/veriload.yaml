scenario:
  path: scenario.py
  user_class: GeneratedModelWorkloadUser
run:
  database:
    driver: sqlite
    dsn: ":memory:"
  users: 1
  spawn_rate: 1
  max_duration_seconds: 5
data:
  pool_size: 1
  seed: 42
  source: memory
profile:
  type: soak
  duration_seconds: 1
  tick_seconds: 0
cleanup:
  enabled: true
  database:
    strategy: delete
safety:
  allowed_hosts: []

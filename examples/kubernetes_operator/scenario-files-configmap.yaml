apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-load-files
  namespace: loads
data:
  scenario.py: |
    """Checkout smoke scenario for the VeriLoad Kubernetes Operator example."""

    from veriload import VeriUser, task


    class CheckoutOperatorUser(VeriUser):
        """Exercise a tiny checkout read/write path with persona-backed payloads."""

        @task(weight=1)
        async def checkout_flow(self) -> None:
            payload = self.payload(
                {
                    "email": "contact.email",
                    "username": "person.username",
                    "company": "company.name",
                }
            )
            await self.http.post("/carts", name="POST /carts", json=payload)
            await self.http.get("/checkout/quote", name="GET /checkout/quote")
            self.stop()

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: veriloadruns.veriload.io
spec:
  group: veriload.io
  scope: Namespaced
  names:
    plural: veriloadruns
    singular: veriloadrun
    kind: VeriLoadRun
    shortNames:
      - vlr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Workers
          type: integer
          jsonPath: .status.readyWorkers
        - name: Failures
          type: integer
          jsonPath: .status.summary.totalFailures
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                - config
                - execution
              properties:
                image:
                  type: string
                  minLength: 1
                config:
                  type: object
                  oneOf:
                    - required:
                        - inline
                    - required:
                        - configMapRef
                  properties:
                    inline:
                      type: string
                    configMapRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: veriload.yaml
                files:
                  type: object
                  properties:
                    configMapRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                execution:
                  type: object
                  required:
                    - workers
                  properties:
                    workers:
                      type: integer
                      minimum: 1
                    controllerPort:
                      type: integer
                      minimum: 1
                      default: 5557
                    readyTimeoutSeconds:
                      type: number
                      minimum: 0.1
                      default: 60
                clusterTokenSecretRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: token
                artifacts:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    retain:
                      type: boolean
                      default: true
                    storage:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - pvc
                            - none
                          default: pvc
                        size:
                          type: string
                          default: 1Gi
                cleanupPolicy:
                  type: string
                  enum:
                    - Retain
                    - DeleteOnSuccess
                    - DeleteAlways
                  default: DeleteOnSuccess
                ttlSecondsAfterFinished:
                  type: integer
                  minimum: 0
                controller:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                worker:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

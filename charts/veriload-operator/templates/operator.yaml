{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "veriload-operator.serviceAccountName" . }}
  namespace: {{ include "veriload-operator.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "veriload-operator.name" . }}
    app.kubernetes.io/managed-by: Helm
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "veriload-operator.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "veriload-operator.name" . }}
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["veriload.io"]
    resources: ["veriloadruns"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["veriload.io"]
    resources: ["veriloadruns/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["veriload.io"]
    resources: ["veriloadruns/finalizers"]
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "veriload-operator.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "veriload-operator.name" . }}
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: {{ include "veriload-operator.serviceAccountName" . }}
    namespace: {{ include "veriload-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "veriload-operator.name" . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veriload-operator.name" . }}
  namespace: {{ include "veriload-operator.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "veriload-operator.name" . }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "veriload-operator.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "veriload-operator.name" . }}
        app.kubernetes.io/managed-by: Helm
{{- with .Values.podLabels }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "veriload-operator.serviceAccountName" . }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: operator
          image: {{ include "veriload-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["operator", "run"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
{{- with .Values.resources }}
          resources:
{{ toYaml . | indent 12 }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}

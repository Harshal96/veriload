[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriload"
version = "0.1.0"
description = "Realistic-state load testing framework powered by VeriSim personas."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VeriLoad Contributors" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "PyYAML>=6",
  "rich>=13",
  "typer>=0.12",
  "verisim==0.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.8",
]
operator = [
  "kopf>=1.38",
  "kubernetes>=31",
]

[project.scripts]
veriload = "veriload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["veriload"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = [
  "B008",  # Typer command metadata is intentionally declared in argument defaults.
  "B010",  # CLI/DSL decorators attach metadata dynamically.
  "B904",  # CLI/framework exception handlers already surface user-friendly errors.
]

[tool.mypy]
python_version = "3.11"
files = ["src/veriload"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
